worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=5s;

    # Определяем внутренние апстримы (имена контейнеров как хосты)
    # Используем порт, на котором приложение слушает ВНУТРИ контейнера (8080), а не внешний порт (1000, 5000 и т.д.)
    upstream auth_service {
        server auth-service:8080; 
    }
    upstream profiles_service {
        server profileservice:8080;
    }
    upstream cv_recognizing_service {
        server cvrecognizingservice:8080;
    }
    upstream cv_hosting_service {
        server cvhostingservice:8080;
    }

    server {
        listen 80;
        server_name cv-hosting.com www.cv-hosting.com;
        
        # 1. Шлюз для AuthService
        location /api/Auth/ {
            proxy_pass         http://auth-service:8080/api/Auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization $http_authorization;
            proxy_set_header   Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_header  Set-Cookie;
            proxy_cookie_path  / /;
            proxy_set_header   Connection "";
        }
        
        location /api/Auth/swagger/ {
            proxy_pass http://auth_service/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Шлюз для ProfileService (например, http://localhost/profile/...)
        location /api/profile/ {
            proxy_pass http://profiles_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # 3. Шлюз для CVRecognizingService (например, http://localhost/api/recognize/...)
        location /api/recognize/swagger/ {
            proxy_pass http://cv_recognizing_service/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/recognize/ {
            proxy_pass http://cv_recognizing_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
            
            # Увеличенные таймауты для обработки файлов
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            client_max_body_size 100M;
        }


        # 4. Шлюз для CVHostingService (например, http://localhost/hosting/...)
        location /api/hosting/ {
            proxy_pass http://cv_hosting_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        # Frontend proxy - направляем все остальное на React dev server
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}